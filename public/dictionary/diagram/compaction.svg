<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" font-family="Noto Sans JP, sans-serif"><defs><filter id="soft" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2a2118" flood-opacity="0.10"/></filter><marker id="ai" markerWidth="13" markerHeight="13" refX="8.5" refY="6" orient="auto"><path d="M2.5 2.5 L9.5 6 L2.5 9.5" fill="none" stroke="#241f18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aa" markerWidth="13" markerHeight="13" refX="8.5" refY="6" orient="auto"><path d="M2.5 2.5 L9.5 6 L2.5 9.5" fill="none" stroke="#b8543a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#241f18" fill-opacity="0.04"/></pattern></defs><rect width="1200" height="660" fill="#fbfaf7"/><rect width="1200" height="660" fill="url(#dots)"/><rect x="80" y="62" width="30" height="3" rx="1.5" fill="#b8543a"/><text x="122" y="70" font-size="15" font-weight="700" letter-spacing="2" fill="#b8543a">FLOW · フロー</text><text x="80" y="118" font-size="23" font-weight="800" fill="#241f18" letter-spacing="-0.5">部屋がいっぱいになると、AIは会話をミキサーにかけます。</text><text x="80" y="150" font-size="18" font-weight="500" fill="#8d8579">会話が長くなると、前半部分を要約して圧縮します。</text><g filter="url(#soft)"><rect x="95" y="287" width="210" height="150" rx="20" fill="#ffffff" stroke="#241f18" stroke-width="2.5"/></g><g stroke="#241f18" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(200 332)"><path d="M-12 -20 H6 l8 8 V20 H-12 Z"/><path d="M6 -20 V-12 H14"/><line x1="-6" y1="-2" x2="8" y2="-2"/><line x1="-6" y1="7" x2="8" y2="7"/></g><text x="200" y="376" text-anchor="middle" font-size="24" font-weight="800" fill="#241f18">会話</text><text x="200" y="400" text-anchor="middle" font-size="15" font-weight="500" fill="#a8a194">積み上がった記録</text><g filter="url(#soft)"><rect x="495" y="287" width="210" height="150" rx="20" fill="#ffffff" stroke="#241f18" stroke-width="2.5"/></g><g stroke="#241f18" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(600 332)"><path d="M0 -16 L18 -6 L0 4 L-18 -6 Z"/><path d="M-18 4 L0 14 L18 4"/></g><text x="600" y="376" text-anchor="middle" font-size="24" font-weight="800" fill="#241f18">コンテキスト</text><text x="600" y="400" text-anchor="middle" font-size="15" font-weight="500" fill="#a8a194">AIの部屋</text><g filter="url(#soft)"><rect x="895" y="274" width="210" height="176" rx="20" fill="#fcf1ec" stroke="#b8543a" stroke-width="3"/></g><g stroke="#b8543a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(1000 332)"><path d="M-16 -12 H16 L4 2 V16 L-4 12 V2 Z"/></g><text x="1000" y="376" text-anchor="middle" font-size="20" font-weight="800" fill="#b8543a">コンパクション</text><text x="1000" y="400" text-anchor="middle" font-size="15" font-weight="500" fill="#9a5640">圧縮・要約</text><line x1="313" y1="362" x2="487" y2="362" stroke="#241f18" stroke-width="2.6" marker-end="url(#ai)"/><g transform="translate(367.5 330)"><circle r="11" fill="#241f18"/><text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="20" y="5" font-size="17" font-weight="600" fill="#241f18">積み上がる</text></g><line x1="713" y1="362" x2="887" y2="362" stroke="#241f18" stroke-width="2.6" marker-end="url(#ai)"/><g transform="translate(754 330)"><circle r="11" fill="#241f18"/><text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="20" y="5" font-size="17" font-weight="600" fill="#241f18">いっぱいになると</text></g></svg>