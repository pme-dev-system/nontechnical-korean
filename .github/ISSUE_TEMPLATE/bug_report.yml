name: 🐛 Bug Report
description: 再現可能なバグを報告します
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "バグ報告ありがとうございます。再現手順を詳しく書いていただくほど早く修正できます。"
  - type: textarea
    id: what
    attributes:
      label: 何が起きましたか?
      description: 期待した動作と実際の動作を一緒に書いてください。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      placeholder: |
        1. ...
        2. ...
        3. エラー発生
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン
      placeholder: "例: v1.2.3"
  - type: textarea
    id: env
    attributes:
      label: 環境
      placeholder: "OS、ランタイムのバージョンなど"
