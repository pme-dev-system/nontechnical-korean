name: ✨ Feature Request
description: 新機能や改善を提案します
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: どんな問題を解決しますか?
      description: "この機能がなくて困っていることを書いてください。"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
  - type: checkboxes
    id: scope
    attributes:
      label: 確認
      options:
        - label: 既存のイシューを検索し、重複していません
          required: true
